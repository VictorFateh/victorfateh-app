    // ── City grid ─────────────────────────────────────────────────────────────
    function renderCityGrid() {
      const grid = document.getElementById('city-grid');
      grid.innerHTML = CITIES.map(city => `
        <div class="city-card" data-id="${city.id}">
          <button class="city-card-top" onclick="selectCity('${city.id}')">
            <div class="city-card-header">
              <div class="city-card-name">${city.name}</div>
              <span class="badge badge-${city.status}">${city.status === 'lived' ? 'Lived' : 'Visited'}</span>
            </div>
            <div class="city-card-country">${city.country}</div>
          </button>
          <div class="city-card-body"></div>
        </div>`
      ).join('');

      // Staggered fade-in replacing skeletons
      requestAnimationFrame(() => {
        grid.querySelectorAll('.city-card').forEach((card, i) => {
          card.style.transitionDelay = (i * 45) + 'ms';
          card.classList.add('visible');
          card.addEventListener('transitionend', () => {
            card.style.transitionDelay = '';
          }, { once: true });
        });
      });
    }

    renderCityGrid();

    // ── Select / deselect city ────────────────────────────────────────────────
    let activeId = null;

    // ── Click outside to close ────────────────────────────────────────────────
    document.addEventListener('click', function(e) {
      if (!activeId) return;
      const grid = document.getElementById('city-grid');
      if (!grid.contains(e.target)) {
        const prevCard = grid.querySelector('[data-id="' + activeId + '"]');
        activeId = null;
        if (prevCard) collapseCard(prevCard, () => grid.classList.remove('has-active'));
      }
    });

    function selectCity(id) {
      const grid  = document.getElementById('city-grid');
      const prevId = activeId;

      // Toggle off if same card
      if (prevId === id) {
        activeId = null;
        const prevCard = grid.querySelector('[data-id="' + prevId + '"]');
        if (prevCard) collapseCard(prevCard, () => grid.classList.remove('has-active'));
        return;
      }

      // Collapse previously active card (open a different one after)
      if (prevId) {
        const prevCard = grid.querySelector('[data-id="' + prevId + '"]');
        if (prevCard) collapseCard(prevCard);
      }

      // Expand clicked card
      activeId = id;
      grid.classList.add('has-active');

      const city    = CITIES.find(c => c.id === id);
      const card    = grid.querySelector('[data-id="' + id + '"]');
      const sections = city.txt ? (TRAVEL_DATA[city.txt] || null) : null;

      card.classList.add('active');
      expandCard(card, city, sections);
    }

    // ── Card expand / collapse animations ────────────────────────────────────
    function expandCard(card, city, sections) {
      const body = card.querySelector('.city-card-body');
      body.innerHTML = renderGuideHTML(city, sections);

      // Animate height 0 → scrollHeight
      body.style.height    = '0';
      body.style.overflow  = 'hidden';
      void body.offsetHeight; // force reflow so transition fires
      body.style.transition = 'height 0.3s cubic-bezier(0.25, 0, 0.2, 1)';
      body.style.height    = body.scrollHeight + 'px';

      body.addEventListener('transitionend', function handler(e) {
        if (e.propertyName !== 'height') return;
        body.style.height    = 'auto';
        body.style.overflow  = '';
        body.style.transition = '';
        body.removeEventListener('transitionend', handler);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    function collapseCard(card, onDone) {
      const body = card.querySelector('.city-card-body');
      if (!body.innerHTML) { card.classList.remove('active'); onDone && onDone(); return; }

      const grid      = document.getElementById('city-grid');
      const allCards  = [...grid.querySelectorAll('.city-card')];
      const isMobile  = window.innerWidth < 640;
      const DUR       = 0.4;
      const EASE      = 'cubic-bezier(0.4, 0, 0.2, 1)';

      if (isMobile) {
        // Mobile: plain height collapse, no layout animation needed
        body.style.height    = body.scrollHeight + 'px';
        body.style.overflow  = 'hidden';
        void body.offsetHeight;
        body.style.transition = 'height ' + DUR + 's ' + EASE;
        body.style.height    = '0';
        body.addEventListener('transitionend', function h(e) {
          if (e.propertyName !== 'height') return;
          body.removeEventListener('transitionend', h);
          body.style.height = body.style.overflow = body.style.transition = '';
          body.innerHTML = '';
          card.classList.remove('active');
          onDone && onDone();
        });
        return;
      }

      // Desktop FLIP: height + position + width all animate simultaneously

      // 1. Snapshot every card before ANY DOM change
      const before = new Map(allCards.map(c => [c, c.getBoundingClientRect()]));

      // 2. Commit final layout instantly (removes grid-column:1/-1, grid reflows)
      card.classList.remove('active');
      onDone && onDone();

      // 3. Read final positions post-reflow
      const after = new Map(allCards.map(c => [c, c.getBoundingClientRect()]));

      // 4. Invert: snap every moved card back to its old visual position via transform
      allCards.forEach(c => {
        const b  = before.get(c);
        const a  = after.get(c);
        const dx = b.left - a.left;
        const dy = b.top  - a.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        c.style.transition = 'none';
        c.style.transform  = 'translate(' + dx + 'px,' + dy + 'px)';
      });
      // Pin the collapsing card at its pre-reflow width so it doesn't snap narrow
      card.style.width = before.get(card).width + 'px';

      // Force reflow so inverted positions are painted before transitions start
      void card.offsetHeight;

      // 5. Play: animate everything to its natural state simultaneously
      allCards.forEach(c => {
        if (!c.style.transform) return;
        c.style.transition = 'transform ' + DUR + 's ' + EASE;
        c.style.transform  = '';
        c.addEventListener('transitionend', function cleanup(ev) {
          if (ev.propertyName !== 'transform') return;
          c.style.transition = '';
          c.removeEventListener('transitionend', cleanup);
        });
      });

      // Animate collapsing card width from full-width to its final half-column width
      const targetW = after.get(card).width;
      card.style.transition = 'width ' + DUR + 's ' + EASE;
      card.style.width      = targetW + 'px';
      card.addEventListener('transitionend', function wDone(ev) {
        if (ev.propertyName !== 'width') return;
        card.style.transition = card.style.width = '';
        card.removeEventListener('transitionend', wDone);
      });

      // Collapse body height in sync
      body.style.height    = body.scrollHeight + 'px';
      body.style.overflow  = 'hidden';
      void body.offsetHeight;
      body.style.transition = 'height ' + DUR + 's ' + EASE;
      body.style.height    = '0';
      body.addEventListener('transitionend', function hDone(e) {
        if (e.propertyName !== 'height') return;
        body.removeEventListener('transitionend', hDone);
        body.style.height = body.style.overflow = body.style.transition = '';
        body.innerHTML    = '';
      });
    }

    // ── Section accordion ─────────────────────────────────────────────────────
    function toggleSection(btn) {
      const section = btn.closest('.cat-section');
      const body    = section.querySelector('.cat-body');

      if (section.classList.contains('open')) {
        // Close
        section.classList.remove('open');
        body.style.height    = body.scrollHeight + 'px';
        body.style.overflow  = 'hidden';
        void body.offsetHeight;
        body.style.transition = 'height 0.28s cubic-bezier(0.4, 0, 0.2, 1)';
        body.style.height    = '0';
        body.addEventListener('transitionend', function handler(e) {
          if (e.propertyName !== 'height') return;
          body.style.transition = '';
          body.removeEventListener('transitionend', handler);
        });
      } else {
        // Open
        section.classList.add('open');
        const targetH        = body.scrollHeight;
        body.style.overflow  = 'hidden';
        void body.offsetHeight;
        body.style.transition = 'height 0.28s cubic-bezier(0.4, 0, 0.2, 1)';
        body.style.height    = targetH + 'px';
        body.addEventListener('transitionend', function handler(e) {
          if (e.propertyName !== 'height') return;
          body.style.height    = 'auto';
          body.style.overflow  = '';
          body.style.transition = '';
          body.removeEventListener('transitionend', handler);
        });
      }
    }

    // ── Render guide HTML (returned as string, injected into card body) ───────
    function renderGuideHTML(city, sections) {
      const totalItems = sections
        ? sections.reduce((n, s) => n + s.items.length, 0)
        : 0;

      let html = '<div class="city-guide">';

      if (!sections) {
        html += '<p class="city-guide-meta">Notes coming soon.</p>';
      } else {
        html += '<p class="city-guide-meta">'
          + totalItems + ' spots &middot; '
          + sections.length + ' ' + (sections.length === 1 ? 'category' : 'categories')
          + '</p>';

        sections.forEach(section => {
          const meta = getSectionMeta(section.name);
          html += `
            <div class="cat-section">
              <button class="cat-summary" onclick="toggleSection(this)">
                <span class="cat-emoji">${meta.emoji}</span>
                <span class="cat-name">${meta.label}</span>
                <span class="cat-count">${section.items.length}</span>
                <span class="cat-chevron">▾</span>
              </button>
              <div class="cat-body" style="height:0;overflow:hidden">
                <div class="cat-items">
                  ${section.items.map(item => renderItem(item)).join('')}
                </div>
              </div>
            </div>`;
        });
      }

      html += '</div>';
      return html;
    }

    // ── Render individual spot ────────────────────────────────────────────────
    function renderItem(item) {
      const urlMatch    = item.note && item.note.match(/https?:\/\/[^\s,)]+/);
      const url         = urlMatch ? urlMatch[0] : null;
      const displayNote = url
        ? item.note.replace(url, '').replace(/,\s*$/, '').replace(/^\s*,\s*/, '').trim()
        : item.note;

      if (item.isRoute) {
        const stops = item.name.split(/—>|→|->/).map(s => s.trim()).filter(Boolean);
        return `
          <div>
            <ul class="route-stops">
              ${stops.map((stop, i) => `
                <li class="route-stop">
                  <span class="route-num">${String(i + 1).padStart(2, '0')}</span>
                  <span class="spot-name" style="font-weight:400">${stop}</span>
                </li>`).join('')}
            </ul>
            ${displayNote ? `<div class="spot-note" style="margin-left:1.4rem">${displayNote}</div>` : ''}
          </div>`;
      }

      return `
        <div>
          <div style="display:flex;align-items:baseline;gap:0.35rem;flex-wrap:wrap">
            <span class="spot-name">${item.name}</span>
            ${url ? `<a href="${url}" target="_blank" rel="noopener" class="spot-url-icon">↗</a>` : ''}
          </div>
          ${displayNote ? `<div class="spot-note">${displayNote}</div>` : ''}
        </div>`;
    }

  </script>
</body>
</html>
