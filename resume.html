<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Resume – Victor Fateh</title>
  <meta name="description" content="Victor Fateh's resume">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://www.victorfateh.com/resume">

  <meta property="og:title" content="Resume – Victor Fateh">
  <meta property="og:description" content="Victor Fateh's resume">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.victorfateh.com/resume">
  <meta property="og:site_name" content="Victor Fateh">

  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="favicon.ico">

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/overwrites.css">

  <meta name="theme-color" content="#0a0a14">
  <link rel="stylesheet" href="css/resume.css">
</head>

<body class="bg-dark-bg text-dark-text antialiased">
  <main class="px-3 py-8 md:py-16">

    <div class="resume-toolbar">
      <a href="/" class="accent-link inline-flex items-center gap-1 text-sm mb-8">
        &larr; Back
      </a>
      <a href="assets/Victor-Fateh-Resume.pdf" download="Victor Fateh - Resume.pdf"
        class="resume-download">Download PDF</a>
    </div>

    <div class="resume-wrap">
      <div class="resume-loader" id="loader">
        <span></span>
      </div>
      <iframe loading="lazy"
        src="resume-doc.html"
        title="Victor Fateh's Resume"
        id="resume-frame"
        onload="this.classList.add('loaded');document.getElementById('loader').classList.add('hidden')">
      </iframe>
    </div>

    <div class="resume-download-footer text-center mt-6">
      <a href="assets/Victor-Fateh-Resume.pdf" download="Victor Fateh - Resume.pdf"
        class="text-sm text-gray-500 hover:text-gray-300 transition-colors">Download</a>
    </div>

  </main>
  <script>
    const resumeFrame = document.getElementById('resume-frame');
    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== resumeFrame.contentWindow) return;
      if (event.data?.type !== 'resume-height' || !Number.isFinite(event.data.height) || event.data.height <= 0) return;
      resumeFrame.parentElement.style.setProperty('--resume-height', `${Math.ceil(event.data.height)}px`);
    });
    // Refresh cached A4-only documents when adopting the responsive layout.
    resumeFrame.src += '?v=responsive-1';
  </script>
</body>

</html>
