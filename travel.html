    // Radius glow circles (outer + inner ring)
    function addRadiusCircle(city) {
      const color = city.status === 'lived' ? '#34d399' : '#a5b4fc';
      const base  = { color: 'transparent', fillColor: color, interactive: false };
      L.circle([city.lat, city.lng], { ...base, radius: city.radius,        fillOpacity: 0.07 }).addTo(map);
      L.circle([city.lat, city.lng], { ...base, radius: city.radius * 0.4,  fillOpacity: 0.09 }).addTo(map);
    }

    function makeIcon(status, active) {
      const color = status === 'lived' ? '#34d399' : '#a5b4fc';
      const size  = active ? 16 : 11;
      const ring  = status === 'lived' ? 'rgba(52,211,153,' : 'rgba(165,180,252,';
      const glow  = active
        ? `0 0 0 4px ${ring}0.35), 0 0 12px ${color}`
        : `0 0 0 3px ${ring}0.15)`;
      return L.divIcon({
        className: '',
        html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:${glow};transition:width .2s,height .2s,box-shadow .2s;"></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
      });
    }

    const cityMarkers = {};
    for (const city of CITIES) {
      addRadiusCircle(city);
      cityMarkers[city.id] = L.marker([city.lat, city.lng], { icon: makeIcon(city.status, false) })
        .addTo(map)
        .bindTooltip(
          `<div class="map-tooltip-inner"><span class="map-tooltip-name">${city.name}</span><span class="map-tooltip-status ${city.status}">${city.status === 'lived' ? 'Lived' : 'Visited'}</span></div>`,
          { permanent: false, direction: 'top', className: 'map-tooltip', offset: [0, -14] }
        )
        .on('click', e => { L.DomEvent.stopPropagation(e); openPanel(city.id); });
    }

    let cityListOpen = window.innerWidth >= 641;

    function updateCityListVisibility() {
      const inner   = document.getElementById('map-city-list-inner');
      const toggle  = document.getElementById('city-list-toggle');
      const chevron = document.getElementById('city-list-toggle-chevron');
      if (isMobile()) {
        inner.style.display             = cityListOpen ? 'flex' : 'none';
        toggle.style.display            = 'flex';
        toggle.setAttribute('aria-expanded', String(cityListOpen));
        chevron.style.transform         = cityListOpen ? 'rotate(180deg)' : '';
      } else {
        inner.style.display  = 'flex';
        toggle.style.display = 'none';
      }
    }

    document.getElementById('city-list-toggle').addEventListener('click', () => {
      cityListOpen = !cityListOpen;
      updateCityListVisibility();
    });

    // Debounced resize
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateCityListVisibility, 120);
    });

    // ── City sidebar list ─────────────────────────────────────────────────────
    function renderCityList(activeId) {
      const el = document.getElementById('map-city-list-inner');
      el.innerHTML = CITIES.map(city => {
        const active = city.id === activeId;
        const label  = city.status === 'lived' ? 'Lived' : 'Visited';
        return `<button class="city-chip${active ? ' active' : ''}" data-city-id="${city.id}" role="listitem">
          <span class="city-chip-name">${city.name}</span>
          <span class="city-chip-pill ${city.status}">${label}</span>
        </button>`;
      }).join('');

      if (activeId) {
        el.querySelector('.city-chip.active')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      updateCityListVisibility();
    }
    renderCityList(null);

    document.getElementById('map-city-list-inner').addEventListener('click', e => {
      const btn = e.target.closest('[data-city-id]');
      if (btn) openPanel(btn.dataset.cityId);
    });

    // ── Panel ─────────────────────────────────────────────────────────────────
    let activePanelId = null;

    function openPanel(id) {
      const city     = CITIES.find(c => c.id === id);
      const sections = city.txt ? (TRAVEL_DATA[city.txt] ?? null) : null;

      // Swap marker states
      if (activePanelId && cityMarkers[activePanelId]) {
        const prev = CITIES.find(c => c.id === activePanelId);
        cityMarkers[activePanelId].setIcon(makeIcon(prev.status, false));
      }
      cityMarkers[id].setIcon(makeIcon(city.status, true));

      // Populate header
      document.getElementById('city-panel-name').textContent    = city.name;
      document.getElementById('city-panel-country').textContent = city.country;
      const pill       = document.getElementById('city-panel-status-pill');
      pill.textContent = city.status === 'lived' ? 'Lived' : 'Visited';
      pill.className   = `city-panel-pill ${city.status}`;

      // Reset search
      const psi = document.getElementById('panel-search-input');
      const psc = document.getElementById('panel-search-clear');
      psi.value = '';
      psc.classList.remove('visible');

      // Render body — collapsed by default
      const body = document.getElementById('city-panel-body');
      body.innerHTML  = renderGuideHTML(city, sections, '', false);
      body.scrollTop  = 0;

      const panel = document.getElementById('city-panel');
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      activePanelId = id;

      renderCityList(id);

      if (isMobile()) {
        cityListOpen = false;
        updateCityListVisibility();
      }

      map.flyTo([city.lat, city.lng], 9, { duration: 1.0 });
    }

    function closePanel() {
      const panel = document.getElementById('city-panel');
      if (!panel.classList.contains('open')) return;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');

      if (activePanelId && cityMarkers[activePanelId]) {
        const prev = CITIES.find(c => c.id === activePanelId);
        cityMarkers[activePanelId].setIcon(makeIcon(prev.status, false));
      }
      activePanelId = null;
      renderCityList(null);
    }

    document.getElementById('city-panel-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

    // ── Section accordion ─────────────────────────────────────────────────────
    // Delegated — no inline onclick needed
    document.getElementById('city-panel-body').addEventListener('click', e => {
      const btn = e.target.closest('.cat-summary');
      if (btn) toggleSection(btn);
    });

    function toggleSection(btn) {
      const section = btn.closest('.cat-section');
      const body    = section.querySelector('.cat-body');
      const opening = !section.classList.contains('open');

      section.classList.toggle('open', opening);
      body.style.overflow   = 'hidden';
      body.style.height     = opening ? '0' : body.scrollHeight + 'px';
      void body.offsetHeight;
      body.style.transition = 'height 0.28s cubic-bezier(0.4,0,0.2,1)';
      body.style.height     = opening ? body.scrollHeight + 'px' : '0';

      body.addEventListener('transitionend', function handler(e) {
        if (e.propertyName !== 'height') return;
        body.removeEventListener('transitionend', handler);
        body.style.transition = '';
        if (opening) {
          body.style.height   = 'auto';
          body.style.overflow = '';
        }
      });
    }

    // ── Render guide HTML ─────────────────────────────────────────────────────
    function renderGuideHTML(city, sections, query, autoOpen) {
      const q = query.toLowerCase().trim();
      if (!sections) {
        return '<div class="city-guide"><p class="city-guide-meta">Notes coming soon.</p></div>';
      }

      const totalItems = sections.reduce((n, s) => n + s.items.length, 0);
      let html = `<div class="city-guide"><p class="city-guide-meta">${totalItems} spots &middot; ${sections.length} ${sections.length === 1 ? 'category' : 'categories'}</p>`;

      for (const section of sections) {
        const meta  = getSectionMeta(section.name);
        const items = q
          ? section.items.filter(item => fuzzyScore(item.name, q) > 0 || fuzzyScore(item.note, q) > 0)
          : section.items;
        if (!items.length) continue;

        html += `<div class="cat-section${autoOpen ? ' open' : ''}">
          <button class="cat-summary" type="button">
            <span class="cat-emoji">${meta.emoji}</span>
            <span class="cat-name">${meta.label}</span>
            <span class="cat-count">${items.length}</span>
            <span class="cat-chevron" aria-hidden="true">&#x25be;</span>
          </button>
          <div class="cat-body" style="height:${autoOpen ? 'auto' : '0'};overflow:${autoOpen ? 'visible' : 'hidden'}">
            <div class="cat-items">${items.map(item => renderItem(item, city, q)).join('')}</div>
          </div>
        </div>`;
      }

      html += '</div>';
      return html;
    }

    // ── Render individual spot ────────────────────────────────────────────────
    // Highlight helper — defined once, not per call
    function highlight(text, q) {
      if (!q || !text) return text ?? '';
      const lower = text.toLowerCase();
      const idx   = lower.indexOf(q);
      if (idx === -1) return text;
      return text.slice(0, idx)
        + '<mark class="search-hl">' + text.slice(idx, idx + q.length) + '</mark>'
        + text.slice(idx + q.length);
    }

    function renderItem(item, city, q) {
      const urlMatch    = item.note?.match(/https?:\/\/[^\s,)]+/);
      const url         = urlMatch?.[0] ?? null;
      const displayNote = url
        ? item.note.replace(url, '').replace(/,\s*$/, '').replace(/^\s*,\s*/, '').trim()
        : item.note;

      const mapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(item.name + ' ' + city.name);

      if (item.isRoute) {
        const stops = item.name.split(/—>|→|->/).map(s => s.trim()).filter(Boolean);
        return '<div><ul class="route-stops">'
          + stops.map((stop, i) => `<li class="route-stop"><span class="route-num">${String(i + 1).padStart(2, '0')}</span><span class="spot-name" style="font-weight:400">${highlight(stop, q)}</span></li>`).join('')
          + '</ul>'
          + (displayNote ? `<div class="spot-note" style="margin-left:1.4rem">${highlight(displayNote, q)}</div>` : '')
          + '</div>';
      }

      return `<div>
        <div style="display:flex;align-items:baseline;gap:0.35rem;flex-wrap:wrap">
          <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="spot-name spot-maps-link">${highlight(item.name, q)}</a>
          ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="spot-url-icon">↗</a>` : ''}
        </div>
        ${displayNote ? `<div class="spot-note">${highlight(displayNote, q)}</div>` : ''}
      </div>`;
    }

    // ── Panel search ──────────────────────────────────────────────────────────
    let panelSearchTimer;

    document.getElementById('panel-search-input').addEventListener('input', function() {
      const q   = this.value;
      const psc = document.getElementById('panel-search-clear');
      psc.classList.toggle('visible', q.length > 0);
      clearTimeout(panelSearchTimer);
      panelSearchTimer = setTimeout(() => repaintPanelBody(q), 80);
    });

    document.getElementById('panel-search-clear').addEventListener('click', () => {
      const psi = document.getElementById('panel-search-input');
      psi.value = '';
      document.getElementById('panel-search-clear').classList.remove('visible');
      repaintPanelBody('');
      psi.focus();
    });

    function repaintPanelBody(q) {
      if (!activePanelId) return;
      const city     = CITIES.find(c => c.id === activePanelId);
      const sections = city.txt ? (TRAVEL_DATA[city.txt] ?? null) : null;
      const results  = q ? fuzzyFilterSections(sections, q) : sections;
      document.getElementById('city-panel-body').innerHTML = renderGuideHTML(city, results, q, q.length > 0);
    }

    // ── Fuzzy search ──────────────────────────────────────────────────────────
    function fuzzyScore(text, q) {
      if (!text || !q) return 0;
      const t  = text.toLowerCase();
      if (t.includes(q)) return 100;
      const words = q.split(/\s+/).filter(Boolean);
      if (words.length > 1) {
        if (words.every(w => t.includes(w))) return 80;
        const n = words.filter(w => t.includes(w)).length;
        if (n > 0) return 30 + n * 10;
      }
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length ? 20 : 0;
    }

    function fuzzyFilterSections(sections, q) {
      if (!sections || !q) return sections;
      const out = [];
      for (const s of sections) {
        const items = s.items.filter(item => fuzzyScore(item.name, q) > 0 || fuzzyScore(item.note, q) > 0);
        if (items.length) out.push({ name: s.name, items });
      }
      return out.length ? out : null;
    }

  </script>
</body>
